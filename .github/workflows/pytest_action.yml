name: Testing with Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src test --max-line-length 100

      - name: Run pytest with coverage gate
        run: |
          mkdir -p reports
          pytest --cov=src --cov-report=term-missing --cov-fail-under=90 \
            --junitxml=reports/pytest-${{ matrix.python-version }}.xml

      - name: CLI smoke test
        run: |
          result=$(python -m src.scientific_calculator --expr "2*sin(30)+sqrt(16)")
          echo "result: $result"
          test "$result" = "5"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: reports/

      - name: Write job summary
        if: always()
        run: |
          echo "### Pytest on Python ${{ matrix.python-version }}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
